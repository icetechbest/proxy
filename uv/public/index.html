<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UV Proxy</title>
<style>body{margin:0;background:#0f1117;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}
form{display:flex;gap:8px;width:min(92vw,560px)}input,button{font:inherit;padding:13px;border-radius:12px;border:1px solid #272b3b;background:#181b26;color:#eee}
input{flex:1;min-width:0;direction:ltr}button{background:#4f7cff;border-color:#4f7cff;cursor:pointer}p{color:#8b90a5;text-align:center}</style></head>
<body><div><h1 style="text-align:center">🌐 UV Proxy</h1>
<form id="f"><input id="q" placeholder="رابط أو كلمة بحث" autofocus><button>اذهب</button></form><p id="m"></p></div>
<script src="/uv/uv.bundle.js"></script><script src="/uv/uv.config.js"></script>
<script>
const $=id=>document.getElementById(id);
$('f').onsubmit=async e=>{e.preventDefault();
  let v=$('q').value.trim();if(!v)return;
  if(!/^[a-z]+:\/\//i.test(v))v=(/^[\w-]+(\.[\w-]+)+([/:?#]|$)/.test(v)&&!/\s/.test(v))?'https://'+v:'https://html.duckduckgo.com/html/?q='+encodeURIComponent(v);
  if(!('serviceWorker' in navigator)){$('m').textContent='المتصفح لا يدعم Service Workers (محتاج HTTPS)';return}
  try{await navigator.serviceWorker.register('/sw.js',{scope:__uv$config.prefix});
    location.href=__uv$config.prefix+__uv$config.encodeUrl(v)}
  catch(err){$('m').textContent='فشل تسجيل الـ Service Worker: '+err.message}};
</script></body></html>
